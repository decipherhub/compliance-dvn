apiVersion: 1

providers:
  - name: compliance-dvn
    orgId: 1
    type: file
    # Read-only in the UI: the dashboards live in the repo, so an edit made in Grafana would be
    # silently lost on the next container restart.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Compliance DVN — demo</title>
<style>
  @font-face{font-family:'Geist';src:url('fonts/geist-500.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Geist';src:url('fonts/geist-600.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Geist Mono';src:url('fonts/geist-mono-400.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Geist Mono';src:url('fonts/geist-mono-500.woff2') format('woff2');font-weight:500;font-display:swap}
  :root{
    --bg:#0a0a0b; --ink:#f4f4f5; --dim:#9a9aa1; --faint:#5c5c63; --line:#222226; --accent:#d8604d;
    --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:'Geist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);-webkit-font-smoothing:antialiased}
  .wrap{width:920px}
  .title{color:var(--ink);font:600 21px/1.1 var(--sans);letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:var(--faint);font:400 13px var(--mono);letter-spacing:.02em;margin-bottom:20px}
  .term{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#080809}
  .bar{padding:11px 16px;border-bottom:1px solid var(--line);color:var(--faint);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .body{padding:18px 20px;height:316px;font-size:14px;line-height:1.72;white-space:pre-wrap;color:var(--dim)}
  .row{opacity:0}
  .cur{display:inline-block;width:8px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .foot{margin-top:16px;display:flex;gap:28px;font:500 12px var(--mono);letter-spacing:.04em}
  .foot span{display:flex;align-items:center;gap:9px;color:var(--dim)}
  .bar2{width:22px;height:2px;background:var(--dim)} .bar2.a{background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Same transfer, one withheld</div>
  <div class="sub">OP → Base · the worker verifies the clean send and withholds the flagged one</div>
  <div class="term">
    <div class="bar">compliance-dvn worker · live testnet</div>
    <div class="body" id="b"></div>
  </div>
  <div class="foot">
    <span><i class="bar2"></i>clean → delivered · 1 TOY</span>
    <span><i class="bar2 a"></i>flagged → withheld · 0 TOY · never settles</span>
  </div>
</div>
<script>
  const ink='#cfcfd4', dim='#8a8a90', faint='#5c5c63', acc='#d8604d', acc2='#c98a7e';
  const lines=[
    {t:'$ npx hardhat demo:clean --network optimism-sepolia',c:dim},
    {t:'  sent 0x5ec2e442…   recipient 0x…cCCc',c:faint},
    {t:'  verify  0x1eb2a747…',c:ink},
    {t:'  commit  0x46db314d…',c:ink},
    {t:'  Base: 1 TOY delivered.',c:ink},
    {t:' ',c:ink},
    {t:'$ npx hardhat demo:veto  --network optimism-sepolia',c:dim},
    {t:'  sent 0xf9038c4f…   recipient 0x…dEaD  [flagged]',c:faint},
    {t:'  veto: withholding verify',c:acc},
    {t:'        reason = denylist hit',c:acc2},
    {t:'  Base: 0 TOY. commit reverts LZ_ULN_Verifying.',c:acc},
    {t:'  message never settles.',c:acc},
  ];
  const b=document.getElementById('b');
  function showUpTo(k){
    b.innerHTML='';
    for(let idx=0;idx<k && idx<lines.length;idx++){
      const ln=lines[idx];const d=document.createElement('div');d.className='row';d.style.color=ln.c;d.style.opacity='1';d.textContent=ln.t;b.appendChild(d);
    }
    const c=document.createElement('span');c.className='cur';b.appendChild(c);
  }
  window.__showUpTo=showUpTo;
  let k=0,autoplay=true;
  function tick(){if(!autoplay)return;showUpTo(k);k++;if(k>lines.length){setTimeout(()=>{k=0;tick();},3000);return;}setTimeout(tick,420);}
  if(!location.search.includes('capture')){tick();}else{autoplay=false;showUpTo(lines.length);}
</script>
</body>
</html>

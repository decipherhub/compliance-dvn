name: Publish

# Continuous + release delivery of the Compliance DVN worker container.
#   - push to main          → ghcr.io/<owner>/compliance-dvn-worker:edge  (+ sha)
#   - tag    v*.*.*         → :MAJOR.MINOR.PATCH, :MAJOR.MINOR, :latest  + GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image repo is derived from the owner so forks publish under their own namespace.
  IMAGE_NAME: ${{ github.repository_owner }}/compliance-dvn-worker

jobs:
  image:
    name: Build & push worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # for build provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # :latest only on a real version tag, never on main.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  release:
    name: GitHub Release
    needs: image
    # Only cut a release for version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can diff against the prior tag

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            Digest: `${{ needs.image.outputs.digest }}`

name: Feature suggestion
description: Suggest a new capability or an improvement to an existing one.
title: "feat: <short summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Suggestions that frame the *problem* before the *solution*
        are the easiest to evaluate. Search
        [existing issues](https://github.com/decipherhub/compliance-dvn/issues?q=is%3Aissue)
        first so we can consolidate related requests.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and where does the current behavior fall short?
      placeholder: |
        As an operator I want to screen against a custom on-chain registry, but assess()
        only merges the four built-in denylist sources today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Rough sketches, API shapes, or config examples are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Contracts (on-chain DVN / verification)
        - Worker — assess / risk engine
        - Worker — service / veto loop
        - Worker — tracker
        - CLI
        - Deploy / wiring
        - New data source (sanctions / denylist)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you ruled them out.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, LayerZero docs, regulatory references, etc.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I'd be willing to help implement this (optional but appreciated).

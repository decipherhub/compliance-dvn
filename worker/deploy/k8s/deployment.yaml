apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-dvn-worker
  labels:
    app.kubernetes.io/name: compliance-dvn-worker
spec:
  # Single writer: the checkpoint file and local nonce tracking assume exactly one instance.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: compliance-dvn-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compliance-dvn-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/your-org/compliance-dvn-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: compliance-dvn-worker-config
            - secretRef:
                name: compliance-dvn-worker-secrets
          # Liveness: restart if the process wedges. Readiness/startup: 503 while
          # INITIALIZING or HALTED (fail-closed), so the worker is "not ready" exactly
          # when it is withholding verification.
          startupProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compliance-dvn-worker-data
        - name: tmp
          emptyDir: {}
